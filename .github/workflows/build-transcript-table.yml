name: Build full audio transcript table
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate full original-filename-to-transcript table
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("workspaces/audio-deception-comparison")
          directory = base / "transcripts"
          inventory = json.loads((directory / "inventory.json").read_text(encoding="utf-8"))
          assert len(inventory) == 35, f"Expected 35 recordings, found {len(inventory)}"
          assert len({x["source"] for x in inventory}) == len(inventory), "Duplicate audio filenames"
          assert all(x["status"] == "ok" for x in inventory), "Incomplete transcript records"
          def cell(text):
              return text.replace("\\", "\\\\").replace("|", "\\|").replace("\r\n", "\n").replace("\n", "<br>")
          lines = [
              "# Full audio transcript table",
              "",
              "Audio source: `audio_last_3_days_deduplicated.zip`. Speech-to-text generated by GitHub Actions run [40439400668](https://github.com/BestNameYet/IssueStack-/actions/runs/40439400668); not manually reviewed.",
              "",
              "| Original audio file name | Full transcript |",
              "| --- | --- |",
          ]
          for item in inventory:
              path = directory / item["transcript"]
              assert path.is_file(), f"Missing transcript {path}"
              transcript = path.read_text(encoding="utf-8").rstrip("\n")
              lines.append(f'| `{cell(item["source"])}` | {cell(transcript) or "*Empty transcript*"} |')
          target = base / "transcript-table.md"
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          assert sum(line.startswith("| `media/") for line in lines) == 35
          print("Validated 35 original filenames and their complete transcript texts")
          PY
      - name: Commit transcript table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workspaces/audio-deception-comparison/transcript-table.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish original audio filename to full transcript table"
            git push origin HEAD:main
          fi
