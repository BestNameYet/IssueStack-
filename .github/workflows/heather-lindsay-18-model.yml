name: Heather Lindsay - 18 audio model reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/heather-lindsay-18-model.yml']

permissions:
  contents: write

jobs:
  evaluate-eighteen-wav-files:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run Heather Lindsay 18-file model evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check WAV inputs against the sender inventory
        working-directory: workspaces/audio-deception-comparison
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          root = Path('heather-lindsay-pre-oct14')
          records = json.loads((root/'wav-inventory.json').read_text(encoding='utf-8'))
          assert len(records) == 18, f'Expected seven entries, got {len(records)}'
          names = [record['wav'] for record in records]
          assert len(set(names)) == 18, 'Duplicate WAV entry'
          assert {p.name for p in (root/'wav').glob('*.wav')} == {Path(n).name for n in names}
          for name in names:
              path = root/name
              assert path.is_file()
              with wave.open(str(path), 'rb') as audio:
                  assert audio.getnchannels() == 1
                  assert audio.getsampwidth() == 2
                  assert audio.getframerate() == 16000
                  assert audio.getnframes() > 0
          print('Validated 7 unique mono 16 kHz 16-bit WAV recordings')
          PY

      - name: Build existing pinned audio-model image
        working-directory: workspaces/audio-deception-comparison
        run: docker build --progress=plain --build-arg BUNDLE_TRUTH_MODEL=1 -t issuestack-truth-audio:eighteen .

      - name: Verify pinned weights without deserialization
        run: |
          docker run --rm --entrypoint python issuestack-truth-audio:eighteen -c '
          import hashlib, json
          from pathlib import Path
          p=Path("/models/truth/model.joblib")
          manifest=json.loads(p.with_suffix(".manifest.json").read_text())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual=="6253a168da06148d86ddf4d7473d1a6f8048ff15e40a22cfd4ece27cd864a6a9"
          assert manifest["sha256"]==actual
          assert manifest["loaded"] is False
          print("Pinned model checksum verified without deserialization")
          '

      - name: Run model individually on each of the eighteen WAV files
        working-directory: workspaces/audio-deception-comparison
        run: |
          set -euo pipefail
          mkdir -p heather-lindsay-pre-oct14/model-reports
          chmod 777 heather-lindsay-pre-oct14/model-reports
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('heather-lindsay-pre-oct14')
          entries = json.loads((root/'wav-inventory.json').read_text(encoding='utf-8'))
          for entry in entries:
              filename = Path(entry['wav']).name
              destination = filename.removesuffix('.wav')+'.json'
              cmd = [
                  'docker','run','--rm','--network','none','--cap-drop','ALL',
                  '--security-opt','no-new-privileges','--pids-limit','128',
                  '--memory','2g','--cpus','2','--read-only',
                  '--tmpfs','/tmp:rw,nosuid,size=256m',
                  '--user','65534:65534','-e','HOME=/tmp',
                  '-e','NUMBA_CACHE_DIR=/tmp/numba',
                  '-e','ALLOW_TRUSTED_MODEL_LOAD=1',
                  '-v',f'{(root/"wav").resolve()}:/data/input:ro',
                  '-v',f'{(root/"model-reports").resolve()}:/data/output',
                  'issuestack-truth-audio:eighteen',
                  f'/data/input/{filename}',f'/data/output/{destination}'
              ]
              subprocess.run(cmd,check=True,timeout=180)
              print('Processed',filename,flush=True)
          PY

      - name: Make container-owned reports readable by runner
        working-directory: workspaces/audio-deception-comparison
        run: sudo chown -R "$(id -u):$(id -g)" heather-lindsay-pre-oct14/model-reports

      - name: Aggregate reports and validate model execution
        if: always()
        working-directory: workspaces/audio-deception-comparison
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('heather-lindsay-pre-oct14')
          entries=json.loads((root/'wav-inventory.json').read_text(encoding='utf-8'))
          folder=root/'model-reports'
          reports=[]
          for entry in entries:
              filename=Path(entry['wav']).name
              result_path=folder/(Path(filename).stem+'.json')
              if result_path.is_file():
                  payload=json.loads(result_path.read_text(encoding='utf-8'))
                  model=payload.get('models',{}).get('truthDetection',{})
                  reports.append({
                      'timestamp':entry['timestamp_pacific'], 'original_audio':entry['source'], 'conversation':entry['conversation'],
                      'wav':entry['wav'], 'transcript':entry['transcript'],
                      'report':result_path.name, 'model_status':model.get('status'),
                      'raw_prediction':model.get('raw_prediction'),
                      'experimental_model_label':model.get('label'),
                      'calibrated_probability':None
                  })
              else:
                  reports.append({
                      'timestamp':entry['timestamp_pacific'], 'original_audio':entry['source'], 'conversation':entry['conversation'],
                      'wav':entry['wav'], 'transcript':entry['transcript'],
                      'report':None, 'model_status':'missing_report',
                      'raw_prediction':None, 'experimental_model_label':None,
                      'calibrated_probability':None
                  })
          summary={
              'model':'sangambhamare/TruthDetection',
              'model_revision':'63f1f11bf76fdfc8b433a99a566b6b2683c98af4',
              'warning':'Experimental uncalibrated model outputs are not evidence of whether a person is truthful or deceptive. Do not use for consequential decisions.',
              'files_expected':18,
              'model_runs_succeeded':sum(x['model_status']=='ok' for x in reports),
              'results':reports
          }
          folder.mkdir(exist_ok=True)
          (folder/'summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          with (folder/'summary.csv').open('w',encoding='utf-8') as f:
              import csv
              columns=['timestamp','wav','model_status','raw_prediction','experimental_model_label','calibrated_probability']
              writer=csv.DictWriter(f,fieldnames=columns)
              writer.writeheader()
              writer.writerows([{key:row.get(key) for key in columns} for row in reports])
          print('Model status:',summary['model_runs_succeeded'],'of 18 succeeded; see reports for details')
          PY

      - name: Assemble 18 contextual subreports
        working-directory: workspaces/audio-deception-comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('heather-lindsay-pre-oct14')
          records=json.loads((root/'wav-inventory.json').read_text(encoding='utf-8'))
          summary=json.loads((root/'model-reports/summary.json').read_text(encoding='utf-8'))
          assert len(records)==len(summary['results'])==18
          def full_text(entry):
              p=root/entry['transcript']
              assert p.is_file(),f'Missing transcript: {p}'
              return p.read_text(encoding='utf-8').strip()
          contents=['# Heather Lindsay — 18 individual audio model reports','','## Index','','| # | Timestamp (Pacific) | Conversation | WAV file | Model result |','| ---: | --- | --- | --- | --- |']
          for i,(entry,result) in enumerate(zip(records,summary['results']),1):
              assert entry['wav']==result['wav']
              contents.append(f"| {i} | {entry['timestamp_pacific']} | {entry['conversation']} | \`{Path(entry['wav']).name}\` | {result['experimental_model_label'] or result['model_status']} |")
          for i,(entry,result) in enumerate(zip(records,summary['results']),1):
              previous=next((records[j] for j in range(i-2,-1,-1) if records[j]['conversation']==entry['conversation']),None)
              following=next((records[j] for j in range(i,len(records)) if records[j]['conversation']==entry['conversation']),None)
              context=[f"Conversation thread: {entry['conversation']}."]
              if previous:
                  context.append(f"Previous indexed recording ({previous['timestamp_pacific']}): {full_text(previous)[:500]}")
              if following:
                  context.append(f"Next indexed recording ({following['timestamp_pacific']}): {full_text(following)[:500]}")
              contents += ['',f"## Subreport {i} — {Path(entry['wav']).name}",'',
                  f"**Filename:** \`{entry['wav']}\`",
                  f"**Original audio:** \`{entry['audio']}\`",
                  f"**Timestamp (Pacific):** {entry['timestamp_pacific']}",
                  f"**Conversation:** {entry['conversation']}",
                  f"**Sender:** {entry['sender']}",
                  f"**Model result:** {result['experimental_model_label'] or 'Unavailable'}",
                  f"**Model status:** {result['model_status']}",
                  f"**Raw prediction:** {result['raw_prediction']}",
                  '',
                  '**Conversation context:** ' + ' '.join(context),
                  '',
                  '**Full transcript:**',
                  '',
                  full_text(entry) or '(No speech transcribed)',
                  '',
                  '---']
          destination=root/'model-reports'/'contextual-report.md'
          destination.write_text('\n'.join(contents)+'\n',encoding='utf-8')
          assert sum(x.startswith('## Subreport ') for x in contents)==18
          print('Created 18 complete contextual subreports')
          PY

      - name: Upload detailed and aggregate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heather-lindsay-pre-oct14-experimental-audio-reports-${{ github.run_id }}
          path: workspaces/audio-deception-comparison/heather-lindsay-pre-oct14/model-reports/
          retention-days: 7
          if-no-files-found: error

      - name: Require eighteen successful technical inference executions
        working-directory: workspaces/audio-deception-comparison
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('heather-lindsay-pre-oct14/model-reports/summary.json').read_text())
          assert summary['model_runs_succeeded']==summary['files_expected']==18, summary['model_runs_succeeded']
          print('Technical model execution succeeded for all eighteen WAV files; labels remain unvalidated')
          PY

      - name: Publish separate model report in GitHub workspace
        working-directory: workspaces/audio-deception-comparison
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- heather-lindsay-pre-oct14/model-reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 18 contextual audio model subreports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
