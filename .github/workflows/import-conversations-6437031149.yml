name: Categorize conversations job 6437031149
on:
  push:
    branches: [stage/conversations-6437031149]
    paths:
      - workspaces/conversation-categorization/job-6437031149/scripts/categorize.py
permissions:
  contents: write
jobs:
  categorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/conversations-6437031149
      - name: Categorize, extract attachments, and verify every original message
        run: python3 workspaces/conversation-categorization/job-6437031149/scripts/categorize.py
      - name: Persist verified catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workspaces/conversation-categorization/job-6437031149 config/file-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Categorize all 82 conversations and verify original messages and attachments"
            git push origin HEAD:stage/conversations-6437031149
          fi
