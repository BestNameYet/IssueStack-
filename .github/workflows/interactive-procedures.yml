name: IssueStack Declared Procedures

on:
  workflow_call:
    inputs:
      comment_event:
        required: true
        type: string
  issue_comment:
    types: [edited]
  push:
    paths:
      - 'src/procedure-documents.js'
      - 'src/interactive-procedures.js'
      - 'src/interactive-procedures.test.js'
      - 'src/issue-1-intake.js'
      - 'src/issue-1-intake.test.js'
      - '.github/workflows/interactive-procedures.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issuestack-declared-procedure-transitions
  cancel-in-progress: false

jobs:
  transition:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.number == 13 && !github.event.issue.pull_request && github.actor == github.repository_owner) || (inputs.comment_event != '' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify agent-only edit, check return type and commit next procedure state
        uses: actions/github-script@v7
        env:
          COMMENT_EVENT: ${{ inputs.comment_event }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const processor = require('./src/procedure-documents.js');
            const runtime = require('./workspaces/issue-comment-input-surface/issue-comment-runtime.js');
            const routed = runtime.adaptContext(context, process.env.COMMENT_EVENT,
              {issues:[13], actions:['edited']});
            await processor.run({github, context:routed, core});

  test:
    if: ${{ inputs.comment_event == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate declared-step syntax and state transitions
        run: node --test src/interactive-procedures.test.js src/issue-1-intake.test.js
