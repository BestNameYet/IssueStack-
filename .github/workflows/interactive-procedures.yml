name: IssueStack Interactive Procedures

on:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/interactive-procedures.js'
      - 'src/interactive-procedures.test.js'
      - '.github/workflows/interactive-procedures.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: issuestack-procedure-transitions
  cancel-in-progress: false

jobs:
  transition:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'issue_comment' && (github.event.issue.number == 13 || github.event.issue.number == 2) && !github.event.issue.pull_request && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent answer and project the next instruction
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const processor = require('./src/interactive-procedures.js');
            await processor.run({github, context, core});

  test:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for tagged JSON and append-only transitions
        run: node --test src/interactive-procedures.test.js
