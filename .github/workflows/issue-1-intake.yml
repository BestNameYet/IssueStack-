name: IssueStack Issue 1 Intake

on:
  workflow_call:
    inputs:
      comment_event:
        required: true
        type: string
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

# Serialize queue publication to prevent concurrent duplicate inserts.
concurrency:
  group: issuestack-issue-1-intake
  cancel-in-progress: false

jobs:
  validate-and-transfer:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.number == 1 && !github.event.issue.pull_request && github.actor != 'github-actions[bot]') || (inputs.comment_event != '' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out listener source
        uses: actions/checkout@v4
      - name: Enforce pinned slots, publish verified transfer, and update ledger
        uses: actions/github-script@v7
        env:
          COMMENT_EVENT: ${{ inputs.comment_event }}
        with:
          # GITHUB_TOKEN edits do not fire subsequent issue_comment workflow runs.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const intake = require('./src/issue-1-intake.js');
            const runtime = require('./workspaces/issue-comment-input-surface/issue-comment-runtime.js');
            const routed = runtime.adaptContext(context, process.env.COMMENT_EVENT,
              {issues:[1], actions:['created','edited']});
            await intake.run({github, context:routed, core});
