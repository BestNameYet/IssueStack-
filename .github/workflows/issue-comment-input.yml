name: Issue Comment Input Surface - Integration Pending

# Fail closed until secondary workflow_call entrypoints are available.
# The original routing design is retained in the workspace, but does not
# execute issue-comment mutations while the secondary integration is blocked.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Report missing secondary workflow integration
        run: |
          echo "::error::Issue-comment input surface is not activated: secondary workflow_call integrations are missing."
          exit 1
