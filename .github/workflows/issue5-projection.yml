name: IssueStack Issue5 Conversation Projection

on:
  workflow_call:
    inputs:
      comment_event:
        required: true
        type: string
  issue_comment:
    types: [created, edited]
  issues:
    types: [edited]
  push:
    paths:
      - 'src/issue5-projection.js'
      - 'src/issue5-projection-workflow.js'
      - 'src/issue5-projection.test.js'
      - 'src/issue5-presentation.js'
      - 'src/issue5-presentation.test.js'
      - 'src/issue5-presentation-integration.test.js'
      - 'config/issue5-presentation-rules.json'
      - 'src/issue5-projection-workflow.test.js'
      - 'config/issue5-rendering.json'
      - '.github/workflows/issue5-projection.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issuestack-issue5-issue7-projection
  cancel-in-progress: false

jobs:
  project:
    if: ${{ ((github.event_name == 'issue_comment' || github.event_name == 'issues') && (github.event.issue.number == 5 || github.event.issue.number == 7) && github.actor == github.repository_owner) || (inputs.comment_event != '' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate two-pass records and update tagged projections in place
        uses: actions/github-script@v7
        env:
          COMMENT_EVENT: ${{ inputs.comment_event }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projection = require('./src/issue5-projection-workflow.js');
            const runtime = require('./workspaces/issue-comment-input-surface/issue-comment-runtime.js');
            const routed = runtime.adaptContext(context, process.env.COMMENT_EVENT,
              {issues:[5,7], actions:['created','edited']});
            const result = await projection.run({github, context:routed, core});
            core.info(JSON.stringify(result));

  test:
    if: ${{ inputs.comment_event == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Issue5/Issue7 two-pass projection and transport adapter
        run: node --test src/issue5-projection.test.js src/issue5-projection-workflow.test.js src/issue5-presentation.test.js src/issue5-presentation-integration.test.js
