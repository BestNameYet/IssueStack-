name: IssueStack Issue 8 Publication Candidate

on:
  push:
    branches: [stage/issue8-registry-publication-6452132288]
    paths:
      - '.github/workflows/issue8-candidate-builder.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: read

concurrency:
  group: issue8-publication-candidate-builder
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging builder
        uses: actions/checkout@v4
      - name: Checkout authoritative production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
      - name: Run source tests
        run: node --test test/agent-context-registry.test.js
      - name: Generate immutable source-linked Issue 8 page candidates
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path=require('node:path');
            const cp=require('node:child_process');
            const reg=require('./src/agent-context-registry.js');
            const pub=require('./src/issue8-context-publisher.js');
            const runtime=require('./src/issue8-context-runtime.js');
            const sourceRoot=path.resolve('production-source');
            const productionCommit=cp.execFileSync('git',['-C',sourceRoot,'rev-parse','HEAD'],{encoding:'utf8'}).trim();
            if(!/^[a-f0-9]{40}$/.test(productionCommit))throw Error('Unverified main SHA');
            const config=reg.loadConfig(path.join(sourceRoot,'config/agent-context-registry.json'));
            const knowledge=JSON.parse(fs.readFileSync(path.join(sourceRoot,'config/agent-context-knowledge.json'),'utf8'));
            const repo=context.repo.owner+'/'+context.repo.repo;
            const record=reg.buildRegistry({root:sourceRoot,repo,commit:productionCommit,config,observedAt:new Date().toISOString()});
            record.runtime=await runtime.observe({github,owner:context.repo.owner,repo:context.repo.repo,config});
            const pages=pub.pagePayloads(record,knowledge).map(p=>{
              const body=pub.pageBody(p.id,p.contents);
              return {page_id:p.id,body,sha256:reg.sha(body),bytes:Buffer.byteLength(body)};
            });
            const candidate={
              schema:'issuestack.agent-context.candidate.v1',
              job_id:6452132288,
              target_issue:8,
              source_commit:productionCommit,
              generated_at:record.generated_at,
              status:'staged_unapproved',
              pages,
              toc_template:{
                schema:'issuestack.agent-context.toc.v1',
                source_commit:productionCommit,
                pages:pages.map(p=>({page_id:p.page_id,comment_id:null,sha256:p.sha256}))
              },
              observations:{
                included_sources:record.sources.length,
                observed_workflows:record.runtime.workflows.length,
                independent_agent_benchmark:'not_run',
                approval_required:true
              },
              warnings:record.uncertainties
            };
            const output=JSON.stringify(candidate,null,2)+'\n';
            const filepath='context-preview/issue8-registry-candidate-v1.json';
            const created=await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path:filepath,
              branch:'stage/issue8-registry-publication-6452132288',
              message:'Stage Issue 8 publication draft from verified main source',
              content:Buffer.from(output,'utf8').toString('base64')
            });
            const saved=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:filepath,ref:'stage/issue8-registry-publication-6452132288'});
            const read=Buffer.from(saved.data.content,'base64').toString('utf8');
            if(read!==output)throw Error('Candidate readback mismatch');
            core.info(JSON.stringify({candidate_sha256:reg.sha(output),pages:pages.map(p=>({id:p.page_id,sha256:p.sha256,bytes:p.bytes})),source_commit:productionCommit,staged_commit:created.data.commit.sha}));
